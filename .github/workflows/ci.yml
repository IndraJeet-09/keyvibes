name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          pkg-config \
          libpipewire-0.3-dev \
          libgtk-4-dev \
          libadwaita-1-dev \
          libudev-dev

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings

    - name: Build
      run: cargo build --verbose

    - name: Build the sound packs
      run: cargo xtask packs

    - name: Run tests
      run: cargo test --workspace --verbose

    - name: Run tests (release)
      run: cargo test --workspace --release --verbose

    - name: Run the security audit
      run: cargo run -q -p keyvibes -- security-test

    - name: Check benchmarks compile
      run: cargo bench --no-run --verbose

  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          pkg-config \
          libpipewire-0.3-dev \
          libgtk-4-dev \
          libadwaita-1-dev \
          libudev-dev

    - name: Build documentation
      run: cargo doc --workspace --no-deps

  package:
    runs-on: ubuntu-latest
    needs: check
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          pkg-config \
          make \
          binutils \
          libpipewire-0.3-dev \
          libgtk-4-dev \
          libadwaita-1-dev \
          libudev-dev \
          libfuse2 \
          zstd \
          desktop-file-utils \
          libgdk-pixbuf-2.0-dev

    - name: Install appimagetool
      run: |
        set -eu
        curl -fsSL -o /tmp/appimagetool \
          https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
        chmod +x /tmp/appimagetool
        # The runner has no FUSE; extract the tool and expose the full tree
        # so the AppRun wrapper can find its bundled binaries.
        cd /tmp && ./appimagetool --appimage-extract >/dev/null
        sudo mv /tmp/squashfs-root /opt/appimagetool
        printf '#!/bin/sh\nexec /opt/appimagetool/AppRun "$@"\n' | sudo tee /usr/local/bin/appimagetool >/dev/null
        sudo chmod +x /usr/local/bin/appimagetool
        appimagetool --version

    - name: Build the artifacts
      run: cargo xtask dist all

    - name: Check the checksums
      run: cd dist/out && sha256sum --check SHA256SUMS

    - name: Validate the packages
      run: |
        set -eu
        echo "== deb contents =="
        ar p dist/out/keyvibes_*_amd64.deb control.tar.gz | tar -tzf - | sort
        echo "== deb data (top two levels) =="
        ar p dist/out/keyvibes_*_amd64.deb data.tar.gz | tar -tzf - | grep -E '^\./usr/(bin|lib/udev|lib/systemd)' | sort
        echo "== rpm =="
        if command -v rpm >/dev/null 2>&1 && ls dist/out/*.rpm >/dev/null 2>&1; then
          rpm -qlp dist/out/*.rpm | grep -E '/(bin/|udev|systemd|kvpack)' | head -40
        else
          echo "rpm tooling not present; spec-only artifact is fine"
        fi
        echo "== AppImage =="
        test -f dist/out/KeyVibes-*-x86_64.AppImage
        test -x dist/out/KeyVibes-*-x86_64.AppImage
        echo "== releases.json parses =="
        python3 -c "import json; d=json.load(open('dist/out/releases.json')); assert d['version']; assert len(d['artifacts']) >= 5; print('ok', len(d['artifacts']), 'artifacts')"

    - uses: actions/upload-artifact@v4
      with:
        name: keyvibes-dist
        path: |
          dist/out/*
          site/releases.json
        if-no-files-found: error

  site:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable

    - name: Build the sound packs
      run: cargo xtask packs

    - name: Build the site catalog and the preview audio
      run: cargo xtask site

    - name: Check every local link resolves
      run: |
        set -eu
        for page in site/*.html; do
          grep -oE '(href|src)="[^"]+"' "$page" | cut -d'"' -f2 | sed 's/#.*//'
        done | grep -vE '^(https?:|mailto:|$)' | sort -u | while read -r target; do
          test -e "site/$target" || { echo "missing: $target"; exit 1; }
        done
        echo "all local links resolve"

    - name: The pack catalog and its preview audio exist
      run: |
        python3 - <<'PY'
        import json, os

        catalog = json.load(open("site/packs.json"))
        packs = catalog["packs"]
        assert catalog["pack_count"] == len(packs) > 0, "empty catalog"

        slugs = [pack["slug"] for pack in packs]
        assert len(set(slugs)) == len(slugs), "two packs share a slug"
        assert len({pack["name"] for pack in packs}) == len(packs), "duplicate pack names"

        genres = {"linear", "tactile", "clicky", "uncategorized"}
        release_packs = 0
        for pack in packs:
            name = pack["name"]
            assert pack["category"] in genres, f"{name}: unknown category"
            assert 0 < pack["coverage"] <= 104, f"{name}: coverage {pack['coverage']}"
            assert pack["has_release"] == (pack["release_keys"] > 0), f"{name}: release flags disagree"
            release_packs += pack["has_release"]

            preview = pack["preview"]
            assert preview, f"{name}: no preview strip"
            path = os.path.join("site", preview["file"])
            assert os.path.exists(path), f"{name}: missing preview file {path}"
            assert preview["sample_rate"] > 0 and preview["channels"] in (1, 2)
            assert preview["slots"], f"{name}: preview has no slot"

            kinds = {slot["kind"] for slot in preview["slots"]}
            assert kinds <= {"press", "release"}, f"{name}: {kinds}"
            if not pack["has_release"]:
                assert "release" not in kinds, f"{name}: release clip without release support"
            for slot in preview["slots"]:
                assert slot["start"] >= 0 and slot["duration"] > 0, f"{name}: bad slot"
                assert slot["start"] + slot["duration"] <= preview["duration"] + 1e-6, \
                    f"{name}: slot runs past the strip"

        print(f"ok: {len(packs)} packs, {release_packs} with release sounds, "
              f"{sum(len(p['preview']['slots']) for p in packs)} preview slots")
        PY

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [check, package]
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        name: keyvibes-dist
        path: dist/out

    - name: Publish the release
      uses: softprops/action-gh-release@v2
      with:
        body_path: RELEASE_NOTES.md
        files: |
          dist/out/*.AppImage
          dist/out/*.deb
          dist/out/*.tar.gz
          dist/out/*.zip
          dist/out/install.sh
          dist/out/uninstall.sh
          dist/out/PKGBUILD
          dist/out/*.spec
          dist/out/SHA256SUMS
          dist/out/releases.json
        generate_release_notes: true
