[pack]
name = "Golden Test Pack"
author = "KeyVibes Tests"
version = "1.0.0"
description = "Deterministic fixture pack for round-trip and golden-file tests."
license = "MIT OR Apache-2.0"
source = "keyvibes-tests"
sample_rate = 48000

[samples]
format = "wav"

# Golden output must stay byte-identical to Phase 4: no DSP, no dither.
[processing]
enabled = false

[[keys]]
physical_key = "A"
samples = ["sounds/a-variant-0.wav", "sounds/a-variant-1.wav"]

[[keys]]
physical_key = "Space"
samples = ["sounds/space.wav"]

[[keys]]
physical_key = "Digit1"
samples = ["sounds/digit1.wav"]
