# Source manifest for the Holy Panda pack.
# Shares the source audio with Default (same directory, so the same WAV
# files), but carries its own identity, description and dither seed - which
# is exactly what `keyvibes --pack "Holy Panda"` has to be able to tell apart
# from `keyvibes --pack "Default"`.

# Provenance: the WAVs in `sounds/` are produced by scripts/generate_sounds.py
# from a physical model of a key press. They are NOT field recordings of real
# switches, and nothing in this repository claims they are. Swapping in
# genuine recordings is a content change; see docs/soundpacks.md.
#
# Regenerate the sources:
#   python3 scripts/generate_sounds.py
#
# Build with:
#   keyvibes pack build assets/soundpacks/default-src/holy-panda.toml \
#       -o "assets/soundpacks/Holy Panda.kvpack"

[pack]
name = "Holy Panda"
author = "KeyVibes"
version = "1.0.0"
description = "Modeled tactile-switch press (synthesized, not a field recording) for all 104 keys, two variants per key. Separate identity from Default so pack switching is observable."
license = "MIT OR Apache-2.0"
source = "keyvibes-synth-switch-v1"
sample_rate = 48000

[samples]
format = "wav"

[processing]
enabled = true
dither_seed = 90210

[[keys]]
physical_key = "Escape"
samples = ["sounds/escape-0.wav", "sounds/escape-1.wav"]

