[pack]
name = "Buckling Spring"
author = "kbsim by Thomas Lai · MIT License"
version = "1.0.0"
description = "clicky mechanical switch pack converted from rustyvibes-v2/kbsim/buckling"
license = "MIT"
source = "rustyvibes-v2/kbsim/buckling"
category = "clicky"
sample_rate = 44100

[samples]
format = "wav"

[processing]
# The importer already trimmed, normalised and dithered these clips
# exactly the way upstream's pack pipeline does. Building with
# processing disabled stores them verbatim (guard samples aside).
enabled = false

