# Source manifest for the Linear pack.
# Same source audio as Default, but exactly **one** variant per key: the same
# sound every press. That makes it structurally different (104 clips instead
# of 208), which is what `keyvibes pack-switch-test` uses to prove a switch
# really happened rather than just re-reading the same file.

# Provenance: the WAVs in `sounds/` are produced by scripts/generate_sounds.py
# from a physical model of a key press. They are NOT field recordings of real
# switches, and nothing in this repository claims they are. Swapping in
# genuine recordings is a content change; see docs/soundpacks.md.
#
# Regenerate the sources:
#   python3 scripts/generate_sounds.py
#
# Build with:
#   keyvibes pack build assets/soundpacks/default-src/linear.toml \
#       -o "assets/soundpacks/Linear.kvpack"

[pack]
name = "Linear"
author = "KeyVibes"
version = "1.0.0"
description = "Modeled switch press (synthesized, not a field recording) for all 104 keys, exactly one variant per key."
license = "MIT OR Apache-2.0"
source = "keyvibes-synth-switch-v1"
sample_rate = 48000

[samples]
format = "wav"

[processing]
enabled = true
dither_seed = 1337

[[keys]]
physical_key = "Escape"
samples = ["sounds/escape-0.wav"]

